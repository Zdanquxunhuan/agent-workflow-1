<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>售后助手 · 会话</title>
<style>body{font:16px system-ui;max-width:850px;margin:32px auto;padding:0 20px;background:#f6f8fb;color:#182435}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;margin:8px 0}button{padding:9px 16px;margin:4px}article{white-space:pre-wrap;background:white;padding:16px;margin:12px 0;border-radius:8px}#status{white-space:pre-wrap;color:#38516d}label{display:block}</style>
<h1>售后助手</h1><p>同一会话可继续追问。业务状态和政策会重新查询。</p>
<label>访问令牌（仅保存在当前页面内存）<input id="token" type="password" autocomplete="off"></label>
<button id="load">读取会话列表</button><button id="create">新会话</button>
<label>选择会话<select id="conversations"><option value="">请选择</option></select></label>
<button id="refresh">刷新记录</button><button id="cancel">取消当前请求</button><button id="remove">删除会话</button>
<p id="status" role="status"></p><section id="history" aria-live="polite"></section>
<form id="form"><label>问题<textarea id="message" maxlength="2000" required placeholder="查询 ORD-1001；下一轮可问：那运费呢？"></textarea></label><button id="send">发送</button></form>
<script src="/conversation.js" defer></script></html>
