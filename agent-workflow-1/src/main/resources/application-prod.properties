# Production baseline. Activate with SPRING_PROFILES_ACTIVE=prod.
# Database, OIDC and secrets must come from the deployment environment; startup
# fails when this profile is active without safe values (see
# ProductionConfigurationGuard).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
