spring.application.name=agent-workflow-1
# V9 read-only chat/conversation runtime. Prices/budgets must be supplied explicitly when enabled.
agent.runtime.enabled=${AGENT_RUNTIME_ENABLED:false}
agent.runtime.currency=${RUNTIME_CURRENCY:USD}
agent.runtime.deadline-seconds=${RUNTIME_DEADLINE_SECONDS:60}
agent.runtime.attempt-seconds=${RUNTIME_ATTEMPT_SECONDS:20}
agent.runtime.max-attempts=${RUNTIME_MAX_ATTEMPTS:6}
agent.runtime.max-tools=${RUNTIME_MAX_TOOLS:8}
agent.runtime.max-active-per-user=${RUNTIME_MAX_ACTIVE_PER_USER:2}
agent.runtime.max-tokens=${RUNTIME_MAX_TOKENS:100000}
agent.runtime.request-budget=${RUNTIME_REQUEST_BUDGET:}
agent.runtime.daily-budget=${RUNTIME_DAILY_BUDGET:}
agent.runtime.allow-local-http=${RUNTIME_ALLOW_LOCAL_HTTP:false}
agent.runtime.primary.input-per-million=${RUNTIME_PRIMARY_INPUT_PRICE:}
agent.runtime.primary.output-per-million=${RUNTIME_PRIMARY_OUTPUT_PRICE:}
agent.runtime.primary.price-version=${RUNTIME_PRIMARY_PRICE_VERSION:}
agent.runtime.backup.enabled=${RUNTIME_BACKUP_ENABLED:false}
agent.runtime.backup.base-url=${RUNTIME_BACKUP_BASE_URL:}
agent.runtime.backup.api-key=${RUNTIME_BACKUP_API_KEY:}
agent.runtime.backup.model=${RUNTIME_BACKUP_MODEL:}
agent.runtime.backup.allowed-tenants=${RUNTIME_BACKUP_ALLOWED_TENANTS:}
agent.runtime.backup.max-output-tokens=${RUNTIME_BACKUP_MAX_OUTPUT_TOKENS:1200}
agent.runtime.backup.input-per-million=${RUNTIME_BACKUP_INPUT_PRICE:}
agent.runtime.backup.output-per-million=${RUNTIME_BACKUP_OUTPUT_PRICE:}
agent.runtime.backup.price-version=${RUNTIME_BACKUP_PRICE_VERSION:}
# V8 fixed, read-only MCP shipment service. No dynamic service discovery or local failure fallback.
agent.mcp.shipment.enabled=${MCP_SHIPMENT_ENABLED:false}
agent.mcp.shipment.url=${MCP_SHIPMENT_URL:}
agent.mcp.shipment.allow-local-http=${MCP_SHIPMENT_ALLOW_LOCAL_HTTP:false}
agent.mcp.shipment.token-url=${MCP_SHIPMENT_TOKEN_URL:}
agent.mcp.shipment.client-id=${MCP_SHIPMENT_CLIENT_ID:}
agent.mcp.shipment.client-secret=${MCP_SHIPMENT_CLIENT_SECRET:}
# V7 authority is JDBC only. Internal index credentials must differ from user JWT credentials.
agent.memory.enabled=${MEMORY_ENABLED:false}
agent.memory.auto-extract=${MEMORY_AUTO_EXTRACT:false}
agent.memory.index-url=${MEMORY_INDEX_URL:}
agent.memory.index-secret=${MEMORY_INDEX_SECRET:}
agent.memory.max-distance=${MEMORY_MAX_DISTANCE:0.45}
# V6 context budget is a conservative UTF-8 byte estimate, not provider usage.
agent.conversation.context-budget=${CONVERSATION_CONTEXT_BUDGET:6000}
agent.conversation.retention-days=${CONVERSATION_RETENTION_DAYS:7}
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# API authentication. local = HS256 tokens signed with local-secret (development
# only); oidc = validate tokens against an OIDC issuer or JWK set. The service
# never reads identity or roles from request headers.
# JWT-only service: do not create Spring Boot's default in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
agent.auth.mode=${AGENT_AUTH_MODE:local}
agent.auth.issuer=${AGENT_AUTH_ISSUER:}
agent.auth.audience=${AGENT_AUTH_AUDIENCE:}
agent.auth.oidc-issuer-uri=${AGENT_AUTH_OIDC_ISSUER_URI:}
agent.auth.jwk-set-uri=${AGENT_AUTH_JWK_SET_URI:}
agent.auth.local-secret=${AGENT_AUTH_LOCAL_SECRET:local-dev-only-change-me-32-bytes-minimum}
# Claim containing roles. Dot paths are supported, e.g. realm_access.roles.
agent.auth.roles-claim=${AGENT_AUTH_ROLES_CLAIM:roles}
# Development-only token issuer. Never enable with a production database.
agent.auth.dev-token-enabled=${AGENT_AUTH_DEV_TOKEN_ENABLED:false}
agent.auth.dev-token-ttl-seconds=${AGENT_AUTH_DEV_TOKEN_TTL_SECONDS:3600}

# DeepSeek is opt-in. When disabled, the deterministic planner keeps local tests
# and demos offline. When enabled, only structured plans come from the model;
# execution remains server-side and is still validated by the tool registry.
agent.deepseek.enabled=${DEEPSEEK_ENABLED:false}
agent.deepseek.gateway=${DEEPSEEK_GATEWAY:legacy}
agent.deepseek.max-output-tokens=${DEEPSEEK_MAX_OUTPUT_TOKENS:1200}
agent.deepseek.allowed-tenants=${DEEPSEEK_ALLOWED_TENANTS:}
agent.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
agent.deepseek.api-key=${DEEPSEEK_API_KEY:}
agent.deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
agent.deepseek.timeout-seconds=${DEEPSEEK_TIMEOUT_SECONDS:30}
agent.workflow.max-steps=${AGENT_MAX_STEPS:8}
agent.workflow.deadline-seconds=${AGENT_DEADLINE_SECONDS:30}
# Startup recovery only claims unfinished tasks older than this. Prevents one
# instance from marking a task that another instance is still executing.
agent.workflow.recovery.stale-seconds=${AGENT_RECOVERY_STALE_SECONDS:120}
agent.workflow.persistence=${AGENT_PERSISTENCE:memory}
# MySQL is the business system of record and the durable task store when
# AGENT_PERSISTENCE=jdbc. Flyway applies db/migration at startup.
mysql.url=${MYSQL_URL:jdbc:mysql://localhost:3307/workflow_agent?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
mysql.user=${MYSQL_USER:workflow}
mysql.password=${MYSQL_PASSWORD:workflow_dev_only}
mysql.pool.max-size=${MYSQL_POOL_MAX_SIZE:10}
mysql.pool.min-idle=${MYSQL_POOL_MIN_IDLE:2}
mysql.pool.connection-timeout-ms=${MYSQL_POOL_CONNECTION_TIMEOUT_MS:5000}
# Demo data is opt-in. Never enable it against a production database.
agent.commerce.seed-demo-data=${COMMERCE_SEED_DEMO_DATA:false}
# sandbox = original local demo; http = independent order/payment service.
agent.commerce.gateway=${COMMERCE_GATEWAY:sandbox}
agent.commerce.tenant=${COMMERCE_TENANT:legacy}
agent.commerce.http.base-url=${COMMERCE_HTTP_BASE_URL:}
agent.commerce.http.api-key=${COMMERCE_HTTP_API_KEY:}
agent.commerce.http.timeout-seconds=${COMMERCE_HTTP_TIMEOUT_SECONDS:2}
agent.commerce.http.writes-enabled=${COMMERCE_HTTP_WRITES_ENABLED:false}
# Dispatches REFUND / CREATE_SHIPMENT / UPDATE_ADDRESS commands from the
# transactional outbox to the configured gateway adapter (sandbox by default).
agent.commerce.dispatcher.enabled=${COMMERCE_DISPATCHER_ENABLED:true}
agent.commerce.dispatcher.batch-size=${COMMERCE_DISPATCHER_BATCH_SIZE:20}
agent.commerce.dispatcher.fixed-delay-ms=${COMMERCE_DISPATCHER_FIXED_DELAY_MS:3000}
agent.commerce.dispatcher.lease-seconds=${COMMERCE_DISPATCHER_LEASE_SECONDS:30}
agent.commerce.dispatcher.retry-delay-seconds=${COMMERCE_DISPATCHER_RETRY_DELAY_SECONDS:10}
agent.commerce.dispatcher.max-attempts=${COMMERCE_DISPATCHER_MAX_ATTEMPTS:5}
agent.audit.outbox.publisher.enabled=${AUDIT_OUTBOX_PUBLISHER_ENABLED:false}
agent.audit.outbox.publisher.fixed-delay-ms=${AUDIT_OUTBOX_FIXED_DELAY_MS:5000}
agent.audit.outbox.publisher.batch-size=${AUDIT_OUTBOX_BATCH_SIZE:50}
agent.audit.outbox.publisher.lease-seconds=${AUDIT_OUTBOX_LEASE_SECONDS:30}
agent.audit.outbox.publisher.retry-delay-seconds=${AUDIT_OUTBOX_RETRY_DELAY_SECONDS:10}
spring.jackson.serialization.write-dates-as-timestamps=false

# External RAG is opt-in locally; prod requires http + HTTPS and a trusted tenant token.
agent.knowledge.backend=${AGENT_KNOWLEDGE_BACKEND:local}
agent.knowledge.http.base-url=${RAG_HTTP_BASE_URL:}
agent.knowledge.http.audience=${RAG_HTTP_AUDIENCE:rag-api}
agent.knowledge.http.timeout-seconds=${RAG_HTTP_TIMEOUT_SECONDS:15}
agent.knowledge.task-enabled=${RAG_TASK_ENABLED:false}
# Local-development delegation only. Do not use local signing in production.
agent.knowledge.delegation.local-secret=${RAG_DELEGATION_LOCAL_SECRET:}
agent.knowledge.delegation.issuer=${RAG_DELEGATION_ISSUER:rag-local}
