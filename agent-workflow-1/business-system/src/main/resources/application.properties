spring.application.name=local-business-system
server.port=${BUSINESS_PORT:8091}
server.shutdown=graceful
spring.datasource.url=${BUSINESS_DB_URL:jdbc:mysql://localhost:3308/local_business?connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${BUSINESS_DB_USER:business}
spring.datasource.password=${BUSINESS_DB_PASSWORD:business_local_only}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=3000
business.api-key=${BUSINESS_API_KEY:}
business.operations-key=${BUSINESS_OPERATIONS_KEY:}
business.seed=${BUSINESS_SEED:false}
business.settlement-delay-seconds=${BUSINESS_SETTLEMENT_DELAY_SECONDS:3}
business.settlement-interval-ms=${BUSINESS_SETTLEMENT_INTERVAL_MS:500}
business.timeout-after-accept-ms=${BUSINESS_TIMEOUT_AFTER_ACCEPT_MS:6000}
spring.jackson.serialization.write-dates-as-timestamps=false
