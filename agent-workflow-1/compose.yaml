services:
  app:
    build: .
    environment:
      SERVER_PORT: 8080
      DEEPSEEK_ENABLED: "false"
      DEEPSEEK_API_KEY: ""
      AGENT_PERSISTENCE: jdbc
      POSTGRES_URL: jdbc:postgresql://postgres:5432/workflow_agent
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow_dev_only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow_agent
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow_dev_only
    ports:
      - "5432:5432"
    volumes:
      - workflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  workflow_pgdata:
