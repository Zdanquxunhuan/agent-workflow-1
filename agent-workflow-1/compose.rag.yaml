name: workflow-rag
x-rag-environment: &rag-environment
  RAG_ENVIRONMENT: development
  RAG_DATABASE_URL: postgresql://rag_api:rag_dev_only@postgres:5432/rag
  RAG_MIGRATION_URL: postgresql+psycopg://postgres:postgres_dev_only@postgres:5432/rag
  RAG_BROKER_URL: amqp://rag:rag_dev_only@rabbitmq:5672//
  RAG_S3_ENDPOINT: http://minio:9000
  RAG_S3_ACCESS_KEY: rag_local
  RAG_S3_SECRET_KEY: rag_object_dev_only
  RAG_EMBEDDING_URL: http://embedding:8092
  RAG_EMBEDDING_KEY: rag-embedding-local-development-key
  RAG_RERANKER_URL: http://reranker:8093
  RAG_RERANKER_KEY: rag-reranker-local-development-key
  RAG_RETRIEVAL_PROFILE: ${RAG_RETRIEVAL_PROFILE:-hybrid-rerank-v2}
  RAG_VERSION_RETENTION_DAYS: ${RAG_VERSION_RETENTION_DAYS:-30}
  RAG_VERSION_KEEP_LATEST: ${RAG_VERSION_KEEP_LATEST:-3}
  RAG_AUTH_SECRET: rag-local-development-secret-at-least-32-bytes
  RAG_AUTH_ISSUER: rag-local
  RAG_DEV_LOGIN_ENABLED: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
    ports: ["127.0.0.1:5438:5432"]
    volumes:
      - rag_postgres:/var/lib/postgresql/data
      - ./rag-service/docker/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rag
      RABBITMQ_DEFAULT_PASS: rag_dev_only
    ports: ["127.0.0.1:5678:5672", "127.0.0.1:15678:15672"]
    volumes: ["rag_rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  minio:
    build: ./rag-service/docker/minio
    image: workflow-rag-minio:local
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: rag_local
      MINIO_ROOT_PASSWORD: rag_object_dev_only
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"]
    volumes: ["rag_objects:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./rag-service
    image: workflow-rag-api:local
    environment: *rag-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    image: workflow-rag-api:local
    environment: *rag-environment
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
  api:
    image: workflow-rag-api:local
    environment: *rag-environment
    ports: ["127.0.0.1:8091:8091"]
    depends_on:
      seed: {condition: service_completed_successfully}
      backfill: {condition: service_completed_successfully}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
  dispatcher:
    image: workflow-rag-api:local
    environment:
      <<: *rag-environment
      RAG_DATABASE_URL: postgresql://rag_dispatcher:rag_dev_only@postgres:5432/rag
    command: ["python", "-m", "app.dispatcher"]
    depends_on:
      seed: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
    init: true
  worker:
    image: workflow-rag-api:local
    environment:
      <<: *rag-environment
      RAG_DATABASE_URL: postgresql://rag_worker:rag_dev_only@postgres:5432/rag
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--pool=solo", "-Q", "rag.ingest"]
    depends_on:
      seed: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      embedding: {condition: service_healthy}
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 30s
  backfill:
    image: workflow-rag-api:local
    environment: *rag-environment
    command: ["python", "-m", "app.backfill", "--all-tenants"]
    depends_on:
      seed: {condition: service_completed_successfully}
  version-gc:
    profiles: ["maintenance"]
    image: workflow-rag-api:local
    environment:
      <<: *rag-environment
      RAG_DATABASE_URL: postgresql://rag_worker:rag_dev_only@postgres:5432/rag
    command: ["python", "-m", "app.version_gc", "--tenant", "${RAG_GC_TENANT:-demo}"]
    depends_on:
      seed: {condition: service_completed_successfully}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
  reranker:
    image: workflow-rag-embedding:local
    command: ["uvicorn", "reranker_server:app", "--host", "0.0.0.0", "--port", "8093", "--no-access-log"]
    environment:
      RERANKER_KEY: rag-reranker-local-development-key
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    volumes: ["rag_models:/models"]
    restart: unless-stopped
    init: true
    mem_limit: 6g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 30
  embedding:
    build: ./rag-inference
    image: workflow-rag-embedding:local
    environment:
      EMBEDDING_KEY: rag-embedding-local-development-key
      HF_HOME: /models
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    volumes: ["rag_models:/models"]
    restart: unless-stopped
    init: true
    mem_limit: 6g
    cpus: 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 60

volumes:
  rag_postgres:
  rag_rabbitmq:
  rag_objects:
  rag_models:
